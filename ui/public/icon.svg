    <rect x="14" y="24" width="6" height="16" rx="3" />
    <rect x="24" y="14" width="6" height="36" rx="3" />
    <rect x="34" y="8" width="6" height="48" rx="3" />
    <rect x="44" y="18" width="6" height="28" rx="3" />
